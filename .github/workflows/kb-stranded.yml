name: Stranded branch reminders

on:
  schedule:
    # 02:30 UTC, and the hour is the whole point. The routine sessions this
    # issue is written for fire at 07:00 and ~09:00 UTC; GitHub does not run a
    # scheduled workflow at its cron time, it queues it. Measured over the 24
    # scheduled runs this repo has of `kb-due` and this workflow: delay min
    # 35.1 min, median 62, **max 232.9**. The old "30 6" therefore could not
    # reach a 07:00 session even in the best case, and did not: all six of its
    # runs delivered at 07:05-07:30, every one of them *after* the session that
    # would act on it had already run its `git ls-remote` check — including the
    # only one that ever had a real stranding to report, which opened issue #68
    # at 07:14:42Z, 11 minutes after that session had found the branch by hand.
    # 02:30 clears the observed maximum by 37 minutes. See ROADMAP.md, Phase 20.
    - cron: "30 2 * * *"
  # Landing the work is what makes the issue wrong, so closing it should not
  # wait for tomorrow's cron. A merge deletes the branch (delete-branch-on-merge
  # is on) and pushes to main, so this run sees count=0 and closes.
  push:
    branches: [main]
  workflow_dispatch:

# A push-triggered run and the scheduled one must not both reach the
# create/close steps: `gh issue create` is not idempotent, and two concurrent
# runs finding no existing issue would open two.
concurrency:
  group: kb-stranded
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  stranded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the predicate is `origin/main..origin/<branch>`

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Enumeration lives here rather than in the script for the same reason
      # kb-due.yml owns its `gh issue` calls: nothing in a unit test can stand
      # up a remote with stranded branches on it. The half that can be tested
      # is kb_stranded_issue.py, which takes this step's JSON.
      - name: Inventory remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit, and `--prune` is load-bearing: a stale remote-tracking
          # ref for a branch that was deleted on merge still answers
          # `rev-list --count` with the squash-merge's commit and would be
          # reported as stranded forever. Observed locally on
          # claude/cool-cerf-bb1xow the moment PR #55 merged.
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          gh pr list --state open --json number,headRefName > prs.json
          python3 - <<'PY'
          import json, subprocess

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True
              ).stdout.strip()

          prs = {p["headRefName"]: p["number"] for p in json.load(open("prs.json"))}
          rows = []
          fmt = "%(refname:lstrip=3)%09%(committerdate:iso-strict)"
          for line in git("for-each-ref", "--format", fmt, "refs/remotes/origin").splitlines():
              branch, _, tip = line.partition("\t")
              if branch in ("main", "HEAD") or not branch:
                  continue
              ahead = int(git("rev-list", "--count", f"origin/main..origin/{branch}"))
              rows.append({
                  "branch": branch,
                  "ahead": ahead,
                  "tip": tip,
                  "pr": prs.get(branch),
              })
          with open("inventory.json", "w") as fh:
              json.dump(rows, fh)
          PY

          cat inventory.json

      - name: Render stranded branches
        id: render
        run: |
          python3 scripts/kb_stranded_issue.py inventory.json > rendered.json
          python3 -c "import json; print('count=' + str(json.load(open('rendered.json'))['count']))" >> "$GITHUB_OUTPUT"
          python3 -c "import json; open('body.md', 'w').write(json.load(open('rendered.json'))['body'])"

      - name: Find existing tracking issue
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "\"Routine sessions: work stranded off main\" in:title" \
            --json number,title --jq '.[] | select(.title == "Routine sessions: work stranded off main") | .number' \
            | head -n1)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        if: steps.render.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.find.outputs.number }}" ]; then
            gh issue edit "${{ steps.find.outputs.number }}" --body-file body.md
          else
            gh issue create --title "Routine sessions: work stranded off main" --body-file body.md
          fi

      - name: Close issue when nothing is stranded
        if: steps.render.outputs.count == '0' && steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ steps.find.outputs.number }}" --comment "Nothing stranded anymore — closing."
